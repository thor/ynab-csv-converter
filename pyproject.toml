[project]
name = "ynab-csv-converter"
version = "2.0.0"
description = "Convert bank exports to YNAB CSV, skipping transactions you already imported"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Anders Ingemann", email = "anders@ingemann.de" },
  { name = "Thor K. Høgås", email = "thor@roht.no" },
]
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/thor/ynab-csv-converter"

[project.scripts]
ynab-csv-converter = "ynab_csv_converter.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
